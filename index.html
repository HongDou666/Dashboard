
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula 3D Dashboard - Quantum Evolution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #01040a;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        canvas { display: block; }
        
        .glass-panel {
            background: rgba(10, 15, 30, 0.3);
            backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(56, 189, 248, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s ease, transform 0.3s ease;
        }

        .glass-panel:hover {
            border-color: rgba(56, 189, 248, 0.2);
            background: rgba(10, 15, 30, 0.4);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 2px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); }

        /* 全局微妙脉动动画 */
        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.3)); }
            50% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); }
        }
        .glow-text { animation: glowPulse 4s infinite ease-in-out; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7",
    "three": "https://esm.sh/three@^0.182.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
